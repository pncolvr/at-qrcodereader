<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="extensionName">AT QR Reader</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <h1 data-i18n="extensionName">AT QR Reader</h1>
    <p id="hint" data-i18n="viewerHint">Drag over the QR code to select it.</p>
  </header>
  <main>
    <section id="capture" aria-label="Page capture" data-i18n-aria-label="captureLabel">
      <div id="stage" hidden>
        <img id="shot" alt="Capture of the page" data-i18n-alt="captureAlt" draggable="false">
        <div id="sel" hidden></div>
      </div>
      <p id="empty" data-i18n="noCapture">No capture loaded. Click the extension button on a page, or paste or drop an image here.</p>
    </section>
    <aside id="result" aria-live="polite" aria-label="QR code contents" data-i18n-aria-label="resultLabel"></aside>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
