<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>e-Fatura QR Reader</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header>
    <h1>e-Fatura QR Reader</h1>
    <p id="hint">Drag over the QR code to select it.</p>
  </header>
  <main>
    <section id="capture" aria-label="Page capture">
      <div id="stage" hidden>
        <img id="shot" alt="Capture of the page" draggable="false">
        <div id="sel" hidden></div>
      </div>
      <p id="empty">No capture loaded. Click the extension button on a page, or paste or drop an image here.</p>
    </section>
    <aside id="result" aria-live="polite" aria-label="QR code contents"></aside>
  </main>
  <script src="viewer.js"></script>
</body>
</html>
