name: Build extension artifact

on:
  push:
    branches: [main, master]
    paths:
      - 'src/extension/**'
      - 'test/**'
      - 'scripts/build.mjs'
      - 'scripts/extension-release.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Set automatic Chrome version
        run: npm run version:extension -- "0.2.$((GITHUB_RUN_NUMBER / 65536)).$((GITHUB_RUN_NUMBER % 65536))"
      # Manual alternative: disable the step above and commit a version bump before pushing.
      # Run locally: npm run version:extension -- <version>
      - run: npm run typecheck
      - run: npm test
      - run: npm run package:extension
      - name: Read version
        id: version
        run: node -e 'console.log("version=" + JSON.parse(require("fs").readFileSync("src/extension/public/manifest.json", "utf8")).version)' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: efatura-qr-reader-${{ steps.version.outputs.version }}
          path: dist/artifacts/efatura-qr-reader-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error
          retention-days: 30