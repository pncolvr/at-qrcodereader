name: Deploy signup page

on:
  push:
    branches: [master]
    paths:
      - 'src/page/**'
      - 'scripts/build.mjs'
      - 'scripts/build-page.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:page
        env:
          GOOGLE_FORM_URL: ${{ vars.GOOGLE_FORM_URL }}
          CHROME_WEB_STORE_URL: ${{ vars.CHROME_WEB_STORE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
